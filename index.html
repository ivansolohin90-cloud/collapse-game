<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Коллапс — большая доска</title>
<style>
:root{--bg:#071b35;--panel:#102d50;--gold:#ffd76a;--muted:#a9c5e5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0,#15558c,#07172e 70%);color:#fff;font-family:system-ui,Arial,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px;max-width:1100px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:clamp(20px,4vw,30px);margin:0;color:var(--gold);text-shadow:0 2px 4px #000}
#status{font-weight:700;color:#fff;background:#12385e;border:1px solid #3674a8;border-radius:12px;padding:8px 12px;flex:1;min-width:180px;text-align:center}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select{border:1px solid #4e83b4;border-radius:10px;padding:9px 12px;background:#174875;color:#fff;font-weight:700;font-size:14px}
button:active{transform:scale(.97)}button.primary{background:linear-gradient(#ffe27b,#f2a900);color:#392300;border:1px solid #fff}
#boardWrap{position:relative;flex:1;min-height:0;border:5px solid #87451f;border-radius:18px;background:#9b5428;box-shadow:0 8px 22px #0008;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{font-size:12px;color:#c5dcf4;text-align:center}
#setup{position:absolute;inset:0;background:#06162beF;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.dialog{width:min(440px,100%);background:#12365b;border:2px solid #64a4d8;border-radius:18px;padding:18px;box-shadow:0 12px 35px #0009}
.dialog h2{margin:0 0 12px;color:var(--gold)}.field{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.field label{font-weight:600}
.dialog p{color:#d5e7f8;font-size:13px;line-height:1.45}.dialog button{width:100%;margin-top:8px}
#bottom{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
#players{display:flex;gap:5px;flex-wrap:wrap}.tag{padding:5px 8px;border-radius:8px;background:#12385e;border:1px solid #315f88;font-size:12px}
#saves{position:absolute;inset:0;background:#06162bef;display:none;align-items:center;justify-content:center;padding:14px;z-index:8}.saveDialog{width:min(520px,100%);max-height:90%;overflow:auto;background:#12365b;border:2px solid #64a4d8;border-radius:16px;padding:16px}.saveRow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid #42678a}.saveRow span{flex:1;min-width:150px;font-size:12px}.saveRow button{padding:7px 9px;font-size:12px}
@media(max-width:600px){#app{padding:7px;gap:6px}.controls button{padding:8px;font-size:12px}.controls select{padding:8px;font-size:12px}#hint{font-size:11px}}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#102d50">
<link rel="icon" type="image/png" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Коллапс">
<link rel="apple-touch-icon" href="./icon-192.png">

</head>
<body><div id="app">
<header><h1>💥 КОЛЛАПС</h1><div id="status">Настрой игру</div></header>
<div class="controls">
<button id="newBtn">Новая игра</button><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="centerBtn">К камере</button><button id="autoCameraBtn" aria-pressed="true">Автокамера: ВКЛ</button><button id="saveBtn">Партии</button><button id="installBtn" class="primary">Установить Коллапс</button>
</div>
<div id="boardWrap"><canvas id="board"></canvas>
<div id="setup"><div class="dialog">
<h2>Новая партия</h2>
<div class="field"><label for="mode">Режим</label><select id="mode"><option value="bots">Против ботов</option><option value="local">На одном устройстве</option></select></div>
<div class="field"><label for="boardSize">Размер поля</label><select id="boardSize"><option value="21x28">21 × 28</option><option value="50x70">50 × 70</option><option value="100x120" selected>100 × 120</option></select></div>
<div class="field"><label for="count">Количество игроков</label><select id="count"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
<div class="field" id="diffRow"><label for="difficulty">Сила ботов</label><select id="difficulty"><option value="smart">Сильные</option><option value="normal">Обычные</option></select></div>
<p>Выбери размер поля. Партии сохраняются автоматически (до 5 незавершённых). Камера следует за игроком, который ходит. Взрывы показываются по шагам.</p>
<button class="primary" id="startBtn">НАЧАТЬ ИГРУ</button>
</div></div><div id="saves"><div class="saveDialog"><h2>Сохранённые партии</h2><div id="savesList"></div><button id="closeSaves">Закрыть</button></div></div></div>
<div id="bottom"><div id="players"></div><div id="hint">Касайся фишки, чтобы повысить её уровень • 4-й уровень взрывается</div></div>
</div>
<script>
(()=>{
let W=100,H=120,N=W*H,colors=['#ef334d','#1685f5','#19bd54','#ffc928','#b44ee8','#ff7b22'],names=['Красный','Синий','Зелёный','Жёлтый','Фиолетовый','Оранжевый'];
const cv=document.getElementById('board'),ctx=cv.getContext('2d'),wrap=document.getElementById('boardWrap');
let owner=new Int8Array(N);owner.fill(-1);let level=new Uint8Array(N),players=2,mode='bots',difficulty='smart',turn=0,placed=0,started=false,gameOver=false,botBusy=false,animating=false;
let cell=24,scale=1,ox=0,oy=0,drag=null,pointers=new Map(),pinch0=null,highlight=new Set(),saveId=null;
let autoCamera=localStorage.getItem('collapseAutoCamera')!=='off';
const $=id=>document.getElementById(id);
function idx(x,y){return y*W+x}function xy(i){return [i%W,Math.floor(i/W)]}function countPieces(p){let c=0;for(let i=0;i<N;i++)if(owner[i]===p)c++;return c}
function setStatus(s){$('status').textContent=s}
function updatePlayers(){let el=$('players');el.innerHTML='';for(let p=0;p<players;p++){let d=document.createElement('span');d.className='tag';d.style.borderColor=colors[p];d.textContent=(mode==='bots'&&p>0?'🤖 ':'')+names[p]+': '+countPieces(p);el.appendChild(d)}}
function resize(){let r=wrap.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.floor(r.width*d));cv.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);if(!ox&&!oy)fit();else draw()}
function fit(){let r=wrap.getBoundingClientRect();scale=Math.min(r.width/(Math.min(W,18)*cell),r.height/(Math.min(H,18)*cell));scale=Math.max(.18,Math.min(4,scale));ox=(r.width-W*cell*scale)/2;oy=(r.height-H*cell*scale)/2;draw()}
function focusPlayer(p,force=false){if(!autoCamera&&!force)return;let sx=0,sy=0,n=0;for(let i=0;i<N;i++)if(owner[i]===p){sx+=i%W;sy+=Math.floor(i/W);n++}if(!n)return;let r=wrap.getBoundingClientRect(),cx=(sx/n+.5)*cell*scale,cy=(sy/n+.5)*cell*scale;ox=r.width/2-cx;oy=r.height/2-cy;draw()}
function draw(){let r=wrap.getBoundingClientRect(),cw=r.width,ch=r.height;ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#111d31';ctx.fillRect(0,0,cw,ch);let s=cell*scale,x0=Math.max(0,Math.floor(-ox/s)),y0=Math.max(0,Math.floor(-oy/s)),x1=Math.min(W,Math.ceil((cw-ox)/s)),y1=Math.min(H,Math.ceil((ch-oy)/s));
for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let px=ox+x*s,py=oy+y*s,i=idx(x,y);ctx.fillStyle=((x+y)&1)?'#192c40':'#20384d';ctx.fillRect(px+1,py+1,s-2,s-2);if(highlight.has(i)){ctx.fillStyle='#fff7a055';ctx.fillRect(px,py,s,s)}if(owner[i]>=0){let rad=s*(.36+level[i]*.018);ctx.beginPath();ctx.arc(px+s/2,py+s/2,rad,0,Math.PI*2);ctx.fillStyle=colors[owner[i]];ctx.fill();ctx.lineWidth=Math.max(1,s*.045);ctx.strokeStyle='#ffffffaa';ctx.stroke();ctx.fillStyle='white';let dots=level[i],rr=Math.max(1.4,s*.065),pos=dots===1?[[0,0]]:dots===2?[[-.13,0],[.13,0]]:dots===3?[[-.12,-.1],[.12,-.1],[0,.13]]:[[-.13,-.13],[.13,-.13],[-.13,.13],[.13,.13]];for(let q of pos){ctx.beginPath();ctx.arc(px+s/2+q[0]*s,py+s/2+q[1]*s,rr,0,Math.PI*2);ctx.fill()}}}}
function screenCell(x,y){let r=wrap.getBoundingClientRect(),s=cell*scale,xx=Math.floor((x-r.left-ox)/s),yy=Math.floor((y-r.top-oy)/s);return xx>=0&&xx<W&&yy>=0&&yy<H?idx(xx,yy):-1}
function zoom(f,cx,cy){let r=wrap.getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;let wx=(cx-ox)/scale,wy=(cy-oy)/scale;scale=Math.max(.18,Math.min(4,scale*f));ox=cx-wx*scale;oy=cy-wy*scale;draw()}
function nextTurn(){for(let k=1;k<=players;k++){let p=(turn+k)%players;if(countPieces(p)>0){turn=p;return}}}
function neighbors(i){let [x,y]=xy(i),a=[];if(y>0)a.push(i-W);if(y<H-1)a.push(i+W);if(x>0)a.push(i-1);if(x<W-1)a.push(i+1);return a}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function persist(){if(!saveId||!started||gameOver)return;let list=loadSaves(),g={id:saveId,updated:Date.now(),W,H,players,mode,difficulty,turn,placed,owner:Array.from(owner),level:Array.from(level)};let k=list.findIndex(x=>x.id===saveId);if(k>=0)list[k]=g;else list.unshift(g);localStorage.setItem('collapseSaves',JSON.stringify(list.slice(0,5)))}
function loadSaves(){try{return JSON.parse(localStorage.getItem('collapseSaves')||'[]')}catch(e){return []}}
function finishGame(winner){gameOver=true;if(saveId){let a=loadSaves().filter(x=>x.id!==saveId);localStorage.setItem('collapseSaves',JSON.stringify(a));saveId=null}setStatus('🏆 Победил: '+names[winner]);alert('Партия завершена! Победил: '+names[winner]);}
function checkWinner(){if(placed<players)return false;let a=[];for(let p=0;p<players;p++)if(countPieces(p)>0)a.push(p);if(a.length===1){finishGame(a[0]);return true}return false}
async function explode(start,p){
  // Цепная реакция идёт волнами: все клетки одной волны взрываются одновременно.
  let wave=[start],waveNo=0;animating=true;
  while(wave.length&&waveNo<10000&&!gameOver){
    wave=Array.from(new Set(wave)).filter(i=>owner[i]===p&&level[i]>=4);
    if(!wave.length)break;
    waveNo++;highlight=new Set(wave);setStatus('💥 Взрывная волна '+waveNo+' · '+names[p]);draw();
    await wait(135);
    // Одновременный взрыв всех клеток текущей волны.
    for(const i of wave){owner[i]=-1;level[i]=0;}
    draw();await wait(85);
    // Сначала считаем все попадания, чтобы соседние клетки получили их в один момент.
    const hits=new Map();
    for(const i of wave)for(const j of neighbors(i))hits.set(j,(hits.get(j)||0)+1);
    highlight=new Set(hits.keys());
    const next=[];
    for(const [j,amount] of hits){owner[j]=p;level[j]+=amount;if(level[j]>=4)next.push(j);}
    draw();await wait(135);
    wave=next;
  }
  highlight=new Set();animating=false;draw();
}
function saveNew(){let id='g'+Date.now()+Math.random().toString(16).slice(2,6);saveId=id;persist()}
function openSaves(){let list=loadSaves(),box=$('savesList');box.innerHTML='';if(!list.length){box.textContent='Сохранённых партий пока нет.'}else list.forEach(g=>{let row=document.createElement('div');row.className='saveRow';let info=document.createElement('span');info.textContent=`${g.W}×${g.H} • ${g.mode==='bots'?'Против ботов':'На одном устройстве'} • ${new Date(g.updated).toLocaleString()}`;let go=document.createElement('button');go.textContent='Продолжить';go.onclick=()=>{loadGame(g.id)};let del=document.createElement('button');del.textContent='Удалить';del.onclick=()=>{localStorage.setItem('collapseSaves',JSON.stringify(loadSaves().filter(x=>x.id!==g.id)));openSaves()};row.append(info,go,del);box.append(row)});$('saves').style.display='flex'}
function loadGame(id){let g=loadSaves().find(x=>x.id===id);if(!g)return;W=g.W;H=g.H;N=W*H;owner=Int8Array.from(g.owner);level=Uint8Array.from(g.level);players=g.players;mode=g.mode;difficulty=g.difficulty;turn=g.turn;placed=g.placed;saveId=g.id;started=true;gameOver=false;botBusy=false;animating=false;$('saves').style.display='none';$('setup').style.display='none';updatePlayers();fit();setStatus('Ход: '+names[turn]);focusPlayer(turn);maybeBot()}
function start(){mode=$('mode').value;players=+$('count').value;difficulty=$('difficulty').value;let dims=$('boardSize').value.split('x').map(Number);W=dims[0];H=dims[1];N=W*H;owner=new Int8Array(N);owner.fill(-1);level=new Uint8Array(N);turn=0;placed=0;started=true;gameOver=false;botBusy=false;animating=false;$('setup').style.display='none';saveNew();setStatus('Стартовая фишка: '+names[turn]);updatePlayers();fit();}
function legalMoves(p){let a=[];for(let i=0;i<N;i++)if(owner[i]===p)a.push(i);return a}
function quickScore(i,p){let ns=neighbors(i),enemy=0,own=0,near=0;for(let j of ns){if(owner[j]===-1)near++;else if(owner[j]===p)own++;else enemy++}return level[i]*1.7+enemy*7+own*2.5+near*.25+(level[i]===3?enemy*5+own*2:0)}
function chooseBotMove(p){let a=legalMoves(p);if(!a.length)return -1;if(difficulty==='normal')return a[Math.floor(Math.random()*a.length)];return a.map(i=>[quickScore(i,p)+Math.random()*.1,i]).sort((x,y)=>y[0]-x[0])[0][1]}
async function afterMove(){persist();updatePlayers();if(checkWinner())return;nextTurn();setStatus('Ход: '+names[turn]);focusPlayer(turn);persist();if(mode==='bots'&&turn!==0)maybeBot()}
async function playCell(i){if(!started||gameOver||botBusy||animating||i<0)return;if(placed<players){if(owner[i]!==-1)return;owner[i]=turn;level[i]=1;placed++;if(placed<players){turn=(turn+1)%players;setStatus('Стартовая фишка: '+names[turn]);}else{turn=0;setStatus('Ход: '+names[turn])}updatePlayers();draw();persist();if(mode==='bots'&&turn!==0)maybeBot();else if(placed===players)focusPlayer(turn);return}if(owner[i]!==turn)return;level[i]++;if(level[i]>=4)await explode(i,turn);draw();await afterMove()}
async function maybeBot(){if(mode!=='bots'||turn===0||gameOver||botBusy||animating)return;botBusy=true;await wait(500);if(placed<players){let i=Math.floor(Math.random()*N);while(owner[i]!==-1)i=Math.floor(Math.random()*N);owner[i]=turn;level[i]=1;placed++;if(placed<players)turn=(turn+1)%players;else turn=0;updatePlayers();draw();persist();setStatus(placed<players?'Стартовая фишка: '+names[turn]:'Ход: '+names[turn]);focusPlayer(turn);botBusy=false;if(turn!==0)maybeBot();return}let i=chooseBotMove(turn);if(i>=0){level[i]++;if(level[i]>=4)await explode(i,turn)}updatePlayers();if(!checkWinner()){nextTurn();setStatus('Ход: '+names[turn]);focusPlayer(turn);persist()}botBusy=false;if(!gameOver&&turn!==0)maybeBot()}
$('startBtn').onclick=start;$('newBtn').onclick=()=>{$('setup').style.display='flex'};$('mode').onchange=e=>$('diffRow').style.display=e.target.value==='bots'?'flex':'none';$('zoomIn').onclick=()=>zoom(1.25);$('zoomOut').onclick=()=>zoom(.8);$('centerBtn').onclick=()=>focusPlayer(turn,true);
function updateCameraButton(){let b=$('autoCameraBtn');b.textContent='Автокамера: '+(autoCamera?'ВКЛ':'ВЫКЛ');b.setAttribute('aria-pressed',String(autoCamera));b.style.background=autoCamera?'#176044':'#4a3b35';b.style.borderColor=autoCamera?'#55c78b':'#b68b6b'}
$('autoCameraBtn').onclick=()=>{autoCamera=!autoCamera;localStorage.setItem('collapseAutoCamera',autoCamera?'on':'off');updateCameraButton();if(autoCamera&&started&&!gameOver)focusPlayer(turn,true)};
$('saveBtn').onclick=openSaves;$('closeSaves').onclick=()=>$('saves').style.display='none';
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,ox,oy,moved:false};if(pointers.size===2){let a=[...pointers.values()];pinch0={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx:(a[0].x+a[1].x)/2-wrap.getBoundingClientRect().left,cy:(a[0].y+a[1].y)/2-wrap.getBoundingClientRect().top};drag=null}});
cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch0){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom(d/pinch0.dist,pinch0.cx,pinch0.cy);pinch0.dist=d;return}if(drag){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;ox=drag.ox+dx;oy=drag.oy+dy;draw()}});
cv.addEventListener('pointerup',e=>{let was=drag;pointers.delete(e.pointerId);if(pointers.size<2)pinch0=null;if(was&&!was.moved&&pointers.size===0)playCell(screenCell(e.clientX,e.clientY));drag=null});cv.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;pinch0=null});cv.addEventListener('wheel',e=>{e.preventDefault();let r=wrap.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});window.addEventListener('resize',resize);window.addEventListener('beforeunload',persist);resize();$('diffRow').style.display='flex';updateCameraButton();
})();

</script>
<script>
(() => {
  let deferredInstallPrompt = null;
  const installButton = document.getElementById('installBtn');
  if (!installButton) return;

  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installButton.textContent = 'Установить Коллапс';
    installButton.style.display = 'inline-block';
  });

  installButton.addEventListener('click', async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installButton.textContent = 'Коллапс установлен';
      return;
    }
    if (window.matchMedia('(display-mode: standalone)').matches) {
      installButton.textContent = 'Коллапс уже установлен';
      return;
    }
    alert('Чтобы установить Коллапс: открой меню Chrome ⋮ и выбери «Установить приложение» или «Добавить на главный экран». Если такого пункта пока нет, обнови страницу и проверь, что сайт открыт по HTTPS.');
  });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((error) => {
        console.warn('Не удалось включить офлайн-режим:', error);
      });
    });
  }
})();
</script>

</body></html>
